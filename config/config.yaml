project: data-reliability-platform

paths:
  data_root: data
  landing: data/landing
  clean: data/clean
  ground_truth: data/ground_truth

storage:
  endpoint: http://minio:9000
  access_key: minioadmin
  secret_key: minioadmin
  buckets:
    landing: landing
    bronze: bronze
    silver: silver
    gold: gold
    quarantine: quarantine

postgres:
  host: postgres
  port: 5432
  db: drp
  user: drp
  password: drp

generator:
  start_date: "2025-01-01"
  days: 14
  rows_per_batch: 500
  seed: 42
  profile: medium   # none | low | medium | high
