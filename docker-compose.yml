services:

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - .:/app
    depends_on:
      - postgres
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: alpine:3.20
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache minio-client &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/landing local/bronze local/silver local/gold local/quarantine;
      exit 0"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drp
      POSTGRES_PASSWORD: drp
      POSTGRES_DB: drp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drp -d drp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Python 3.11 + Java + PySpark + Delta + DuckDB. All our code runs in here.
  app:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  # Optional: only starts with `docker compose --profile airflow up -d` (used from Phase 7)
  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile.airflow
    profiles: ["airflow"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - .:/opt/airflow/project

volumes:
  minio_data:
  pg_data: